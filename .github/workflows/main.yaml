name: 🚀 Deploy to Production

on:
  workflow_dispatch:
  # push:
  #   branches:
  #    - main

jobs:
  build:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🕒 Generate timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_ENV

      - name: 🔨 Creating .env files
        run: |
          echo -n "${{ secrets.PRODUCTION_DEPLOY_ENV_ACQUIRER }}" | tr -d '\r' > ./acquirer-server/.env
          echo -e "\nAPP_VERSION=${{ env.timestamp }}" >> ./acquirer-server/.env

          echo -n "${{ secrets.PRODUCTION_DEPLOY_ENV_BRANDS }}" | tr -d '\r' > ./brands-server/.env
          echo -e "\nAPP_VERSION=${{ env.timestamp }}" >> ./brands-server/.env

          echo -n "${{ secrets.PRODUCTION_DEPLOY_ENV_ISSUER }}" | tr -d '\r' > ./issuer-server/.env
          echo -e "\nAPP_VERSION=${{ env.timestamp }}" >> ./issuer-server/.env

          echo -n "${{ secrets.PRODUCTION_DEPLOY_ENV_WEB }}" | tr -d '\r' > ./web/.env.production
          echo -e "\nAPP_VERSION=${{ env.timestamp }}" >> ./web/.env.production

      - name: 📦 Setup pnpm
        run: npm install -g pnpm@10.0.0

      - name: 🔧 Install all dependencies
        run: pnpm install:all

      - name: 👷 Building all projects
        run: pnpm build

      - name: 🚢 Deploy to Production server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          ARGS: '-rlgoDzvc -i'
          SOURCE: '.'
          REMOTE_HOST: ${{ secrets.PRODUCTION_HOST }}
          REMOTE_USER: ${{ secrets.PRODUCTION_SUDO_USERNAME }}
          EXCLUDE: '/.git/, /.github/, /tb-data/, /docs/, /.dockerignore, /.eslint*, /.prettier*, /acquirer-server/src/, /acquirer-server/scripts/, /brands-server/src/, /brands-server/scripts/, /issuer-server/src/, /issuer-server/scripts/, /web/src/'
          TARGET: ${{ secrets.PRODUCTION_PROJECT_DIR }}

  deploy:
    name: 🚀 Restart Services
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🏁 Reload Production Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SUDO_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.PRODUCTION_PROJECT_DIR }}
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 24
            echo "Starting containers..."
            pnpm compose:up:production
            echo "Stopping production servers..."
            pnpm stop:production
            echo "Starting production servers..."
            pnpm start:production
